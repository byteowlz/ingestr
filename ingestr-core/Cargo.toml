[package]
name = "ingestr-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

description = "Core document conversion library for ingestr (documents to Markdown)"
keywords = ["document", "conversion", "markdown", "pdf"]
categories = ["text-processing"]

[features]
default = []
# Derive `clap::ValueEnum` for option enums (used by the CLI).
clap = ["dep:clap"]

[dependencies]
anyhow.workspace = true
clap = { workspace = true, optional = true }
dirs.workspace = true
hex.workspace = true
hf-hub.workspace = true
image.workspace = true
liteparse.workspace = true
pdfium = { package = "liteparse-pdfium", version = "1.11" }
log.workspace = true
markitdown.workspace = true
oar-ocr.workspace = true
tempfile.workspace = true
ocrs.workspace = true
rayon.workspace = true
regex.workspace = true
reqwest.workspace = true
rten.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true
tokio.workspace = true

[dev-dependencies]
# Build synthetic OOXML/ZIP fixtures in tests (ingestr-ayq3); same major as
# the vendored markitdown's zip so only one 3.x gets compiled.
zip = "3.0"

[lints]
workspace = true