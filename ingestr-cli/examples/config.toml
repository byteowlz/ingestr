# Example configuration for the ingestr markdown service.
# Copy to $XDG_CONFIG_HOME/ingestr-cli/config.toml (or ~/.config/ingestr-cli/config.toml).

profile = "default"

[logging]
# Valid levels: error, warn, info, debug, trace
level = "info"
# file = "~/Library/Logs/ingestr-cli.log"

[runtime]
# parallelism = 8
timeout = 60
fail_fast = true

[watcher]
watch_dir = "~/Documents"
debounce_ms = 750
skip_hidden = true

[output]
markdown_dir = "~/markdown"

[paths]
# data_dir = "$XDG_DATA_HOME/ingestr-cli"
# state_dir = "$XDG_STATE_HOME/ingestr-cli"

[llm]
# Enable LLM-based image description generation
enabled = false
# LLM provider: "openai", "gemini", or "deepseek"
client = "openai"
# Model name (e.g., "gpt-4o", "gemini-1.5-flash", "deepseek-chat")
model = "gpt-4o"
# Custom API base URL (for OpenAI-compatible endpoints, local LLMs, etc.)
# base_url = "http://localhost:11434/v1"
# API key (can also use environment variables: OPENAI_API_KEY, GEMINI_API_KEY, DEEPSEEK_API_KEY)
# api_key = "sk-..."

[processors.ocr]
# Enable OCR processing (as a fallback for scanned or image-only inputs)
enabled = false
# OCR backend: paddle (default; bundled PP-OCR ONNX engine, CPU-only),
# tesseract, ocrs, surya, easyocr
backend = "paddle"
# PP-OCR model size for the paddle backend: tiny | small | medium.
# Models are fetched from Hugging Face into the HF cache on first use
# (sha256-pinned). Set INGESTR_SHARED_HF_HOME to a pre-seeded shared cache,
# HF_HUB_OFFLINE=1 to forbid downloads.
paddle_model = "small"
# PP-OCR engines working in parallel (default 1, ~300 MB each). Only helps on
# hosts with many physical cores; measure before raising.
# engines = 1
# Also OCR PDF pages that merely have a sparse native text layer (no embedded
# images). Off by default: those are short native-text pages and OCR-ing them
# costs seconds each. Scanned / text-less / garbled pages are always OCR'd.
ocr_sparse_pages = false
# Languages for OCR (passed to the backend)
languages = ["eng"]
# Render DPI used when OCR-ing scanned pages.
page_dpi = 300
# Optional local OCR HTTP server URL (liteparse OCR API). When set, PDF OCR
# is delegated to this server instead of liteparse's built-in Tesseract.
# ocr_server_url = "http://localhost:8000"

[processors.layout]
# Layout analysis (ADR-0005): crop charts, diagrams and pictures from PDF
# pages that have vector figures or are scanned, and link the PNGs in the
# Markdown. Needs an output path (-o). Uses PP-DocLayout_plus-L (~125 MB,
# Hugging Face, sha256-pinned), ~1 s per selected page on CPU.
enabled = false
# Render DPI for layout pages and crops.
page_dpi = 200
# Minimum detection score for a region to be cropped.
min_score = 0.5

[processors.vlm]
enabled = false
# model = "gpt-4o"
# llm_url = "http://localhost:11434/v1"
# prompts = { default = "Describe this image in detail." }

# Semantic tier-router seam (System One / kev). This is a SPIKE seam: it routes
# each document/page to one of a small closed set of ingestion tiers using a
# local System-One decision model served over HTTP (e.g. `jaredpalmer/kev`
# serving `POST /v1/systemone`). See docs/research/2026-ocr-vlm-semantic-router.md.
[routing]
# mode = "heuristic"  # heuristic (default, deterministic) | shadow | route
# router_url = "http://localhost:8009"  # System-One base URL; required for shadow/route
# model = "kev-latest"
# api_key = "sk-..."
